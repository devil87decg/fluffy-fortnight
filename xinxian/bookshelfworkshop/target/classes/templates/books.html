<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>BookShelf - All Books</title>
</head>

<body>

	<h1> All Books</h1>
	<a th:href="@{/}">Back to Home</a>
	<div>
		<form action="/books/search" method="GET">
			<input type="text" name="query" th:value="${currentQuery}" placeholder="Search books">
			<button type="submit">Search</button>
		</form>
	</div>
	
	<p th:text="|There are ${books.size()} books in the library.|"></p>
	<!-- th:if checks whether the list is empty -->
	<p th:if="${#lists.isEmpty(books)}"> No books in the library yet.</p>

	<!-- Only show when the flash attribute exists -->
	<div th:if="${successMessage}" th:text="${successMessage}"
		style="background:#d4edda; color:#155724; padding:10px; border-radius: 4px;">
	</div>

	<table th:unless="${#lists.isEmpty(books)}">
		<thead>
			<tr>
				<th>ID</th>
				<th>Title</th>
				<th>Author</th>
				<th>Year</th>
				<th>Genre</th>
				<th>Action</th>
				<th>Delete</th>
			</tr>
		</thead>
		<tbody>
			<!-- th:each loops over the "books" list from the Model-->
			<tr th:each="book : ${books}">
				<!-- ${book.id} calls book.getId() automatically -->
				<td th:text="${book.id}">1</td>
				<td th:text="${book.title}">Title</td>
				<td th:text="${book.author}">Author</td>
				<td th:text="${book.year}">2024</td>
				<td th:text="${book.genre}">Genre</td>
				<td>
					<!-- Link to detail page, passing book ID in the URL -->
					<a th:href="@{/books/{id}(id=${book.id})}"> View Details</a>
				</td>
				<td><a th:href="@{/books/delete/{id}(id=${book.id})}">Delete</a></td>
			</tr>
		</tbody>
	</table>

	<br>
	<a th:href="@{/books/add}">Add New Book</a>
</body>

</html>
